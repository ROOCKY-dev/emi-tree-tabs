name: Build

on:
  push:
    # dev as well as main: dev is where the interface overhaul is being assembled, and a branch
    # carrying weeks of unreleased work is exactly the one that should not be building only on a
    # developer's machine.
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless. ForgeGradle builds are slow
# enough that letting them pile up is a real waste.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caching matters disproportionately here: an uncached ForgeGradle run downloads and
      # decompiles Minecraft, which takes minutes.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      # The loader module produces the real mod jar; the root project is only a container and
      # emits an empty one, so it must not be what gets uploaded.
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: emitreetabs-${{ github.sha }}
          path: |
            forge/build/libs/*.jar
            fabric/build/libs/*.jar
            !**/*-sources.jar
            !**/*-dev-shadow.jar
          if-no-files-found: error
