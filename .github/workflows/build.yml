name: Build

on:
  push:
    # dev as well as main: dev is where the interface overhaul is being assembled, and a branch
    # carrying weeks of unreleased work is exactly the one that should not be building only on a
    # developer's machine.
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless. ForgeGradle builds are slow
# enough that letting them pile up is a real waste.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # JDK 21 for the whole build, not 17. Minecraft 1.21 is a Java 21 game and Loom refuses to
      # set it up on an older daemon, so the 1.21.1 modules cannot be configured at all on 17. The
      # 1.20.1 modules still build on it: each declares a Java 17 toolchain, and ForgeGradle runs
      # forked on that toolchain rather than on the daemon.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Caching matters disproportionately here: an uncached ForgeGradle run downloads and
      # decompiles Minecraft, which takes minutes.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      # A loader module produces the real mod jar; the root project is only a container and
      # emits an empty one, so it must not be what gets uploaded. Both Minecraft versions ship from
      # this repository, so both sets of loader modules are here - 1.20.1 Forge and Fabric, 1.21.1
      # NeoForge and Fabric.
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: emitreetabs-${{ github.sha }}
          path: |
            forge/build/libs/*.jar
            fabric/build/libs/*.jar
            mc1211/fabric/build/libs/*.jar
            mc1211/neoforge/build/libs/*.jar
            !**/*-sources.jar
            !**/*-dev-shadow.jar
          if-no-files-found: error
