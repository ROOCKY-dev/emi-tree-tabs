name: Build

on:
  push:
    # dev as well as main: a branch carrying weeks of unreleased work is exactly the one that
    # should not be building only on a developer's machine. mc/* are the maintenance branches for
    # older Minecraft versions, port/* the work towards newer ones.
    branches: [main, dev, 'mc/**', 'port/**']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless. ForgeGradle builds are slow
# enough that letting them pile up is a real waste.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The JDK the checked-out code asks for: 21 on 1.21.1, 17 on the 1.20.1 branch, which predates
      # the property and so takes the fallback.
      - name: Read the Java version
        id: java
        run: echo "v=$(grep -oP '^java_version=\K.*' gradle.properties || echo 17)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK ${{ steps.java.outputs.v }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.java.outputs.v }}

      # Caching matters disproportionately here: an uncached ForgeGradle run downloads and
      # decompiles Minecraft, which takes minutes.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      # The loader module produces the real mod jar; the root project is only a container and
      # emits an empty one, so it must not be what gets uploaded.
      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: emitreetabs-${{ github.sha }}
          # Every loader module, whichever ones this branch has (forge on 1.20.1, neoforge after).
          path: |
            */build/libs/*.jar
            !common/build/libs/*.jar
            !**/*-sources.jar
            !**/*-dev-shadow.jar
          if-no-files-found: error
