name: Build

on:
  push:
    # dev as well as main: a branch carrying weeks of unreleased work is exactly the one that
    # should not be building only on a developer's machine. mc/* are the maintenance branches for
    # older Minecraft versions, port/* the work towards newer ones.
    branches: [main, dev, 'mc/**', 'port/**']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless. ForgeGradle builds are slow
# enough that letting them pile up is a real waste.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.lines.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Select both supported Minecraft lines
        id: lines
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          props = dict(line.split('=', 1) for line in Path('gradle.properties').read_text().splitlines() if '=' in line and not line.startswith('#'))
          lines = json.loads(Path('.github/release-lines.json').read_text())
          for line in lines:
              line['ref'] = os.environ['GITHUB_SHA'] if line['minecraft'] == props['minecraft_version'] else 'refs/heads/' + line['branch']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('matrix=' + json.dumps({'include': lines}), file=output)
          PYCODE

  build:
    needs: plan
    name: Build Minecraft ${{ matrix.minecraft }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the Minecraft line
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test coordinated release gates
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools/tests -v

      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: emitreetabs-${{ matrix.minecraft }}-${{ github.sha }}
          path: |
            */build/libs/*.jar
            !common/build/libs/*.jar
            !**/*-sources.jar
            !**/*-dev-shadow.jar
          if-no-files-found: error
