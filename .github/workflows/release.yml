name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build a release from'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      # The tag is the source of truth. If gradle.properties disagrees the jars would be named
      # something other than what the tag claims, so fail rather than publish a mislabelled file.
      - name: Resolve and check version
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="$(grep -oP '^mod_version=\K.*' gradle.properties)"
          echo "tag=$TAG mod_version=$VERSION"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match mod_version $VERSION in gradle.properties"
            exit 1
          fi
          test -f "forge/build/libs/emitreetabs-forge-$VERSION.jar"
          test -f "fabric/build/libs/emitreetabs-fabric-$VERSION.jar"
          echo "v=$VERSION" >> "$GITHUB_OUTPUT"

      # Exact filenames, not globs. A glob also matches the -sources and -dev-shadow jars, which
      # leaves a release page where nobody can tell which file to download.
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            forge/build/libs/emitreetabs-forge-${{ steps.ver.outputs.v }}.jar
            fabric/build/libs/emitreetabs-fabric-${{ steps.ver.outputs.v }}.jar
          generate_release_notes: true
          draft: true
