name: Publish to stores

# Deliberately NOT tied to `v*` tags.
#
# Development moves faster than players want releases. Every `v*` tag builds and stages a GitHub
# release, which costs nothing and bothers nobody; pushing all of those to Modrinth and CurseForge
# would spam followers and bury the versions that actually matter. So the stores are opt in: they
# publish only when a `store-v*` tag says so.
#
#   git tag store-v2.2.0 && git push origin store-v2.2.0
#
# Rehearse first from the Actions tab with dry_run ticked; that validates the credentials, the
# files and every field against both stores without publishing anything.

on:
  push:
    tags: ['store-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the v (e.g. 2.2.0)'
        required: true
      dry_run:
        description: 'Validate everything without publishing'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # A store-v* tag marks a release that already exists; the code to build is the v* tag.
      - name: Work out which version to publish
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#store-v}"
          fi
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Could not read a version from '${GITHUB_REF_NAME}${{ inputs.version }}'"
            exit 1
          fi
          echo "v=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION"

      - name: Check out the matching release tag
        uses: actions/checkout@v4
        with:
          ref: v${{ steps.ver.outputs.v }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      # Same guard as the release workflow: if gradle.properties disagrees with the tag, the jars
      # are named something other than what is being published.
      - name: Check the build matches the tag
        run: |
          V="${{ steps.ver.outputs.v }}"
          BUILT="$(grep -oP '^mod_version=\K.*' gradle.properties)"
          if [ "$V" != "$BUILT" ]; then
            echo "::error::Publishing $V but gradle.properties says $BUILT"
            exit 1
          fi
          test -f "forge/build/libs/emitreetabs-forge-$V.jar"
          test -f "fabric/build/libs/emitreetabs-fabric-$V.jar"

      # The GitHub release for this tag already carries notes written for players, and they have
      # been reviewed by the time anyone decides to push to the stores. Reading them back here
      # keeps one source of truth. A file in the repo cannot serve: this job checks out the
      # release tag, so anything added to main afterwards is simply not present.
      - name: Take the changelog from the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.ver.outputs.v }}"
          if gh release view "v$V" --json body -q .body > release-notes.md 2>/dev/null \
             && [ -s release-notes.md ]; then
            echo "Changelog: $(wc -l < release-notes.md) lines from release v$V"
          else
            echo "::warning::No notes on release v$V; publishing without a changelog"
            : > release-notes.md
          fi

      # What the rehearsal actually checks. Everything mc-publish would need, verified directly:
      # the credentials work, the project is reachable, and the exact files exist.
      - name: Rehearse (dry run only)
        if: ${{ inputs.dry_run }}
        env:
          MR: ${{ secrets.MODRINTH_TOKEN }}
          CF: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          V="${{ steps.ver.outputs.v }}"
          UA="roocky-dev/ett-publish (roocky@roocky.dev)"
          fail=0

          mr=$(curl -s -o /tmp/mr.json -w '%{http_code}' -A "$UA" -H "Authorization: $MR" \
                https://api.modrinth.com/v2/project/si3AK8q5)
          if [ "$mr" = 200 ]; then
            echo "Modrinth: token OK, project reachable"
            python3 - <<'EOF'
          import json
          d = json.load(open('/tmp/mr.json'))
          print('  project:', d.get('title'), '| status:', d.get('status'))
          print('  versions already on Modrinth:', len(d.get('versions', [])))
          EOF
          else
            echo "::error::Modrinth returned HTTP $mr"; fail=1
          fi

          cf=$(curl -s -o /dev/null -w '%{http_code}' -H "X-Api-Token: $CF" \
                https://minecraft.curseforge.com/api/game/versions)
          [ "$cf" = 200 ] && echo "CurseForge: token OK" \
                          || { echo "::error::CurseForge returned HTTP $cf"; fail=1; }

          for f in "forge/build/libs/emitreetabs-forge-$V.jar" \
                   "fabric/build/libs/emitreetabs-fabric-$V.jar"; do
            [ -f "$f" ] && echo "file OK: $f ($(stat -c%s "$f") bytes)" \
                        || { echo "::error::missing $f"; fail=1; }
          done

          echo "changelog: $(wc -c < release-notes.md) bytes"
          echo "would publish: $V+forge (forge) and $V+fabric (fabric), 1.20.1, release"
          exit $fail

      # One version per loader, not one version carrying both jars. Modrinth's download button
      # serves only the *primary* file, so a combined version hands Fabric users the Forge jar.
      # mc-publish's own dry-run cannot be trusted: it logged `dry-run: true` and uploaded to both
      # stores anyway, creating duplicate versions. The rehearsal therefore never reaches the action
      # at all - these steps are skipped outright.
      - name: Publish Forge
        if: ${{ !inputs.dry_run }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: si3AK8q5
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: '1677804'
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: forge/build/libs/emitreetabs-forge-${{ steps.ver.outputs.v }}.jar
          name: EMI Tree Tabs ${{ steps.ver.outputs.v }} (Forge)
          version: ${{ steps.ver.outputs.v }}+forge
          version-type: release
          loaders: forge
          # 1.20.1 only, deliberately. The jar declares [1.20.1,1.21) but EMI publishes no Forge
          # build past 1.20.2, so a wider range advertises installs that cannot work.
          game-versions: '1.20.1'
          java: '17'
          dependencies: emi(required)
          changelog-file: release-notes.md

      - name: Publish Fabric
        if: ${{ !inputs.dry_run }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: si3AK8q5
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: '1677804'
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: fabric/build/libs/emitreetabs-fabric-${{ steps.ver.outputs.v }}.jar
          name: EMI Tree Tabs ${{ steps.ver.outputs.v }} (Fabric)
          version: ${{ steps.ver.outputs.v }}+fabric
          version-type: release
          loaders: fabric
          game-versions: '1.20.1'
          java: '17'
          dependencies: emi(required)
          changelog-file: release-notes.md
