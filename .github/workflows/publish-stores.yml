name: Publish to stores

# Deliberately NOT tied to `v*` tags.
#
# Development moves faster than players want releases. Every `v*` tag builds and stages a GitHub
# release, which costs nothing and bothers nobody; pushing all of those to Modrinth and CurseForge
# would spam followers and bury the versions that actually matter. So the stores are opt in: they
# publish only when a `store-v*` tag says so.
#
#   git tag store-v2.2.0 && git push origin store-v2.2.0
#
# Nothing about the Minecraft versions or the loaders is written down in this file. Both are read
# out of the checked-out tag, so a Minecraft port or a loader swap needs no edit here:
#
#   loaders            <- the modules in settings.gradle (forge+fabric now, neoforge+fabric later)
#   Minecraft versions <- publish_game_versions in gradle.properties
#
# Rehearse from the Actions tab with dry_run ticked. The rehearsal never reaches mc-publish.

on:
  push:
    tags: ['store-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the v (e.g. 2.2.0)'
        required: true
      dry_run:
        description: 'Validate everything without publishing'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Work out what is being published before building anything, so the publish job can fan out over
  # whatever loaders this branch actually has.
  plan:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.read.outputs.v }}
      loaders: ${{ steps.read.outputs.loaders }}
      game_versions: ${{ steps.read.outputs.game_versions }}
    steps:
      # A store-v* tag marks a release that already exists; the code to build is the v* tag.
      - name: Work out which version to publish
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#store-v}"
          fi
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Could not read a version from '${GITHUB_REF_NAME}${{ inputs.version }}'"
            exit 1
          fi
          echo "v=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check out the matching release tag
        uses: actions/checkout@v4
        with:
          ref: v${{ steps.ver.outputs.v }}

      - name: Read the loaders and Minecraft versions out of the repo
        id: read
        run: |
          V="${{ steps.ver.outputs.v }}"
          echo "v=$V" >> "$GITHUB_OUTPUT"

          # Loaders are whichever modules exist besides `common`. After the 1.21.1 port that becomes
          # neoforge+fabric on its own, with no change to this file.
          LOADERS=$(grep -oP "^include '\K[^']+" settings.gradle | grep -v '^common$' | sort)
          if [ -z "$LOADERS" ]; then
            echo "::error::settings.gradle lists no loader modules"; exit 1
          fi
          JSON=$(printf '%s\n' $LOADERS | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          echo "loaders=$JSON" >> "$GITHUB_OUTPUT"

          GV=$(grep -oP '^publish_game_versions=\K.*' gradle.properties | tr -d '[:space:]' || true)
          if [ -z "$GV" ]; then
            # Fall back to the single version this branch builds against, never to
            # minecraft_version_range — the range spans versions EMI has no build for.
            GV=$(grep -oP '^minecraft_version=\K.*' gradle.properties | tr -d '[:space:]')
            echo "::warning::publish_game_versions unset; falling back to minecraft_version=$GV"
          fi
          echo "game_versions=$GV" >> "$GITHUB_OUTPUT"

          echo "Publishing $V | loaders: $(echo $LOADERS | tr '\n' ' ')| Minecraft: $GV"

  publish:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      # One loader failing should not stop the others from reaching players.
      fail-fast: false
      matrix:
        loader: ${{ fromJson(needs.plan.outputs.loaders) }}
    steps:
      - name: Check out the matching release tag
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.plan.outputs.v }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      # If gradle.properties disagrees with the tag, the jar is named something other than what is
      # being published.
      - name: Check the build matches the tag
        run: |
          V="${{ needs.plan.outputs.v }}"
          BUILT="$(grep -oP '^mod_version=\K.*' gradle.properties)"
          if [ "$V" != "$BUILT" ]; then
            echo "::error::Publishing $V but gradle.properties says $BUILT"; exit 1
          fi
          test -f "${{ matrix.loader }}/build/libs/emitreetabs-${{ matrix.loader }}-$V.jar"

      # The GitHub release for this tag already carries notes written for players, reviewed by the
      # time anyone decides to push to the stores. A file in the repo cannot serve: this job checks
      # out the release tag, so anything added to main afterwards is not present.
      - name: Take the changelog from the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ needs.plan.outputs.v }}"
          if gh release view "v$V" --json body -q .body > release-notes.md 2>/dev/null \
             && [ -s release-notes.md ]; then
            echo "Changelog: $(wc -l < release-notes.md) lines from release v$V"
          else
            echo "::warning::No notes on release v$V; publishing without a changelog"
            : > release-notes.md
          fi

      # What the rehearsal checks, verified directly rather than by asking mc-publish to pretend.
      - name: Rehearse (dry run only)
        if: ${{ inputs.dry_run }}
        env:
          MR: ${{ secrets.MODRINTH_TOKEN }}
          CF: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          V="${{ needs.plan.outputs.v }}"
          L="${{ matrix.loader }}"
          UA="roocky-dev/ett-publish (roocky@roocky.dev)"
          fail=0

          mr=$(curl -s -o /tmp/mr.json -w '%{http_code}' -A "$UA" -H "Authorization: $MR" \
                https://api.modrinth.com/v2/project/si3AK8q5)
          if [ "$mr" = 200 ]; then
            python3 -c "import json; d=json.load(open('/tmp/mr.json')); print('Modrinth OK:', d['title'], '| status', d['status'], '|', len(d.get('versions',[])), 'versions live')"
          else
            echo "::error::Modrinth returned HTTP $mr"; fail=1
          fi

          cf=$(curl -s -o /dev/null -w '%{http_code}' -H "X-Api-Token: $CF" \
                https://minecraft.curseforge.com/api/game/versions)
          [ "$cf" = 200 ] && echo "CurseForge OK" \
                          || { echo "::error::CurseForge returned HTTP $cf"; fail=1; }

          JAR="$L/build/libs/emitreetabs-$L-$V.jar"
          [ -f "$JAR" ] && echo "jar OK: $JAR ($(stat -c%s "$JAR") bytes)" \
                        || { echo "::error::missing $JAR"; fail=1; }

          echo "changelog: $(wc -c < release-notes.md) bytes"
          echo "WOULD PUBLISH: $V+$L | loader $L | Minecraft ${{ needs.plan.outputs.game_versions }} | release"
          exit $fail

      # mc-publish's own dry-run cannot be trusted: it logged `dry-run: true` and uploaded to both
      # stores anyway, creating duplicate versions. So a rehearsal never reaches this step at all.
      #
      # One version per loader, not one version carrying every jar. Modrinth's download button
      # serves only the *primary* file, so a combined version hands Fabric users the Forge jar.
      - name: Publish ${{ matrix.loader }}
        if: ${{ !inputs.dry_run }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: si3AK8q5
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: '1677804'
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ matrix.loader }}/build/libs/emitreetabs-${{ matrix.loader }}-${{ needs.plan.outputs.v }}.jar
          name: EMI Tree Tabs ${{ needs.plan.outputs.v }} (${{ matrix.loader }})
          version: ${{ needs.plan.outputs.v }}+${{ matrix.loader }}
          version-type: release
          loaders: ${{ matrix.loader }}
          game-versions: ${{ needs.plan.outputs.game_versions }}
          java: '17'
          dependencies: emi(required)
          changelog-file: release-notes.md
