# Minecraft 1.21.1 needs a JDK 21. If your default JDK is a different one, pass:
#   ./gradlew build -Dorg.gradle.java.home=/path/to/jdk21
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
org.gradle.parallel=false

# Multiloader tooling
architectury_plugin_version=3.4-SNAPSHOT
architectury_loom_version=1.7-SNAPSHOT
mixin_version=0.8.5

# Minecraft / NeoForge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neoforge_version=21.1.265
neoforge_version_range=[21.1,)
loader_version_range=[4,)
# The same range in Fabric's syntax, for fabric.mod.json. Not "~1.21.1": to Fabric that means
# anything below 1.22, which would claim 1.21.2 onwards, where the code has never run.
fabric_minecraft_range=>=1.21.1 <1.21.2
java_version=21

# EMI we compile against. 1.1.22 is the first EMI built for 1.21.1.
emi_version=1.1.24+1.21.1
emi_version_range=[1.1.22,)

# Minecraft versions the published jars are declared to support, comma separated.
#
# Not derived from minecraft_version_range. On 1.20.1 auto-detecting from a range claimed 1.20.1
# through 1.20.6, which is what Modrinth guessed and it was wrong; only list what has been run.
#
# One value is the normal case. Widen it only when a build has actually been run on each version
# listed. The publish workflow reads this, so a new Minecraft version needs no workflow edit.
publish_game_versions=1.21.1

# Fabric
fabric_loader_version=0.19.5
fabric_api_version=0.116.17+1.21.1

# Optional: drives the in-game config screen. Soft dependency, absent is fine.
#
# YACL rather than Cloth Config, which is stale by its own developer's account. YACL builds for
# NeoForge and Fabric on 1.21.1, which is exactly this mod's matrix, and gives tabs, collapsible
# groups and rich option descriptions.
yacl_version=3.6.6+1.21.1
# Only to run the dev client: YACL bundles these and Forge unpacks them for players, but Loom's
# dev classpath does not. Keep in step with what the YACL jar's jarjar metadata lists.
quilt_parsers_version=0.2.1

# Mod metadata
mod_id=emitreetabs
mod_name=EMI Tree Tabs
mod_license=MIT
mod_version=5.0.0
mod_group_id=dev.roocky.emitreetabs
mod_authors=ROOCKY DEV
mod_description=Track several EMI recipe trees at once. Every tree you open becomes a tab you can switch between, rename, fork, reorder and keep across restarts. Group them into phases you can park so a later stage stops asking for materials, get one crafting list across every tree that tells you which tree wants each material and what it goes into, and make your trees agree when they drift onto different recipes.
