# ForgeGradle needs a JDK 17; it cannot run on Java 21+ (unsupported class file version).
# If your default JDK is newer, either set JAVA_HOME or pass:
#   ./gradlew build -Dorg.gradle.java.home=/path/to/jdk17
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
org.gradle.parallel=false

# Multiloader tooling
architectury_plugin_version=3.4-SNAPSHOT
architectury_loom_version=1.7-SNAPSHOT
mixin_version=0.8.5

# Minecraft / Forge
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.2.0
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

# EMI we compile against. The mod is compatible with any 1.1.x EMI for 1.20.1.
emi_version=1.1.24+1.20.1
emi_version_range=[1.1.0,)

# Fabric
fabric_loader_version=0.19.5
fabric_api_version=0.92.12+1.20.1

# Optional: drives the in-game config screen. Soft dependency, absent is fine.
cloth_version=11.1.136

# Mod metadata
mod_id=emitreetabs
mod_name=EMI Tree Tabs
mod_license=MIT
mod_version=2.0.1
mod_group_id=dev.roocky.emitreetabs
mod_authors=ROOCKY DEV
mod_description=Track several EMI recipe trees at once. Every tree you open becomes a tab you can switch between, rename, fork, reorder and keep across restarts, and crafting mode can gather what to make from all of them at once.
