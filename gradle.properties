# The build needs a JDK 21 daemon, because Minecraft 1.21 is a Java 21 game and Loom refuses to set
# it up on anything older - the 1.21.1 modules cannot even be configured on 17. The 1.20.1 modules
# declare a Java 17 toolchain and still compile on it: Loom runs ForgeGradle forked, on that
# toolchain rather than on the daemon. If your default JDK is not 21:
#   ./gradlew build -Dorg.gradle.java.home=/path/to/jdk21
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
org.gradle.parallel=false

# Multiloader tooling
architectury_plugin_version=3.4-SNAPSHOT
# One Loom for the whole repository, so it has to be a version that can build both trees: it
# predates 1.21.1 (1.7 was the 1.20.1 build's pin) and it knows neoforge().
architectury_loom_version=1.10.455
mixin_version=0.8.5

# Minecraft / Forge
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.2.0
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

# EMI we compile against. The mod is compatible with any 1.1.x EMI for 1.20.1.
emi_version=1.1.24+1.20.1
emi_version_range=[1.1.0,)

# Minecraft versions the published jars are declared to support, comma separated.
#
# Not derived from minecraft_version_range: that says [1.20.1,1.21), and auto-detecting from it
# claims 1.20.1 through 1.20.6, which is what Modrinth guessed and it is wrong — EMI publishes no
# Forge build past 1.20.2, so those extra versions advertise installs that cannot work.
#
# One value is the normal case. Widen it only when a build has actually been run on each version
# listed. This is the fallback for a module that does not name a version of its own; the 1.21.1
# modules name theirs, so 1.20.1 being this value is what keeps their jars named `1.21.1-…`.
publish_game_versions=1.20.1

# Fabric
fabric_loader_version=0.19.5
fabric_api_version=0.92.12+1.20.1

# ---------------------------------------------------------------------------
# Minecraft 1.21.1 (the mc1211-* modules)
#
# Kept separate from the 1.20.1 numbers above rather than merged into them, because the 1.20.1
# modules are still built and published: this repository now ships both. Note what changed and
# why - EMI and YACL both stopped publishing Forge builds after 1.20.x, so the 1.21.1 Forge-flavoured
# module is NeoForge. Nothing about a 1.20.1 build changes as a result of any of this.
minecraft_version_1_21_1=1.21.1
neoforge_version=21.1.209
neoforge_version_1_21_1=21.1.209
neoforge_version_range=[21.1,)
# 1.21 runs on Java 21, so the 1.21.1 modules need a 21 toolchain where the 1.20.1 ones need 17.
# The root java_version below is the 1.20.1 default; the modules override it in their own
# gradle.properties, which the root build script reads directly.
fabric_loader_version_1_21_1=0.17.1
fabric_api_version_1_21_1=0.115.6+1.21.1
emi_version_1_21_1=1.1.24+1.21.1
emi_version_range_1_21_1=[1.1.0,)
yacl_version_1_21_1=3.7.1+1.21.1
# Mixin 0.8.5 predates Java 21 and has no JAVA_21 compatibility level, which the mixin config of a
# 1.21.1 mod has to name.
mixin_version_1_21_1=0.8.7
# 1.21's YACL still ships the same json parsers under the same coordinates.
quilt_parsers_version_1_21_1=0.2.1

# Store publishing, for the modules that opt in.
#
# A module is published when its own gradle.properties names the loader to publish as. The 1.20.1
# modules do not say so, because they have always been the only ones: the publish workflow falls
# back to the module name and to the root's publish_game_versions for them, exactly as before.
#
# Both trees publish from the same tag, so a store version has to be unique per upload, not per
# mod version: 4.0.0+1.20.1-forge and 4.0.0+1.21.1-neoforge, not 4.0.0+forge and 4.0.0+neoforge.

# Optional: drives the in-game config screen. Soft dependency, absent is fine.
#
# YACL rather than Cloth Config, which is stale by its own developer's account. YACL builds for
# Forge 1.20.1 and NeoForge 1.20.4+, which is exactly this mod's matrix, and gives tabs,
# collapsible groups and rich option descriptions. Note it will not support Forge past 1.20.1 -
# which happens to be where EMI stops publishing Forge builds anyway.
yacl_version=3.6.6+1.20.1
# Only to run the dev client: YACL bundles these and Forge unpacks them for players, but Loom's
# dev classpath does not. Keep in step with what the YACL jar's jarjar metadata lists.
quilt_parsers_version=0.2.1

# Java toolchain. A module may raise this in its own gradle.properties, which the root build
# script reads directly: 1.20.1 is a Java 17 game, 1.21 is a Java 21 one.
java_version=17

# Mod metadata
mod_id=emitreetabs
mod_name=EMI Tree Tabs
mod_license=MIT
mod_version=4.0.0
mod_group_id=dev.roocky.emitreetabs
mod_authors=ROOCKY DEV
mod_description=Track several EMI recipe trees at once. Every tree you open becomes a tab you can switch between, rename, fork, reorder and keep across restarts. Group them into phases you can park so a later stage stops asking for materials, get one crafting list across every tree that tells you which tree wants each material and what it goes into, and make your trees agree when they drift onto different recipes.
