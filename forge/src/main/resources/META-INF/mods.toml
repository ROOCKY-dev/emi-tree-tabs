modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}
'''
# Nothing here affects the server, so never fail a connection over a version mismatch.
displayTest="IGNORE_ALL_VERSION"

# Forge 1.20.1 spells this "mandatory". "type=required" is 1.20.2+/NeoForge syntax and makes
# 47.x reject the whole file with "Missing required field mandatory in dependency".
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="emi"
    mandatory=true
    versionRange="${emi_version_range}"
    ordering="AFTER"
    side="CLIENT"

# Optional. Only used to draw the in-game settings screen; the json config works without it.
[[dependencies.${mod_id}]]
    modId="cloth_config"
    mandatory=false
    versionRange="[11,)"
    ordering="AFTER"
    side="CLIENT"

[[mixins]]
    config="${mod_id}-common.mixins.json"
