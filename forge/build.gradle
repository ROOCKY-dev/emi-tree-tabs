plugins {
	id 'com.github.johnrengelman.shadow' version '8.1.1'
}

architectury {
	platformSetupLoomIde()
	forge()
}

loom {
	forge {
		mixinConfig "${mod_id}-common.mixins.json"
	}

	runs {
		client {
			name = 'Forge Client'
			// Deliberately small: these are throwaway test instances for verifying the mod loads
			// and its mixins apply, not for playing a modpack.
			vmArgs '-Xmx2G', '-Xms512M'
			// Surface mixin problems loudly instead of letting a failed injection pass quietly.
			property 'mixin.debug', 'true'
			property 'mixin.checks', 'true'
		}
	}
}

configurations {
	common {
		canBeResolved = true
		canBeConsumed = false
	}
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentForge.extendsFrom common

	shadowBundle {
		canBeResolved = true
		canBeConsumed = false
	}
}

dependencies {
	forge "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

	modImplementation "dev.emi:emi-forge:${emi_version}"
	// Optional: only drives the in-game config screen, never bundled.
	modCompileOnly "dev.isxander:yet-another-config-lib:${rootProject.yacl_version}-forge"
	// ...but present in the dev client, otherwise the config screen can never be tested.
	modLocalRuntime "dev.isxander:yet-another-config-lib:${rootProject.yacl_version}-forge"

	// YACL jar-in-jars its json parsers, and Forge's JarJar unpacks them for a real install - the
	// published artifact's META-INF/jarjar/metadata.json lists them, so players are unaffected.
	// Loom's dev classpath does not run JarJar, so without these the dev client dies at startup
	// with NoClassDefFoundError: org/quiltmc/parsers/json/gson/GsonWriter and YACL never loads.
	// Runtime-only and dev-only: nothing here reaches a published jar.
	forgeRuntimeLibrary "org.quiltmc.parsers:gson:${rootProject.quilt_parsers_version}"
	forgeRuntimeLibrary "org.quiltmc.parsers:json:${rootProject.quilt_parsers_version}"

	common(project(path: ':common', configuration: 'namedElements')) { transitive false }
	shadowBundle project(path: ':common', configuration: 'transformProductionForge')
}

tasks.named('shadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
	configurations = [project.configurations.shadowBundle]
	archiveClassifier = 'dev-shadow'
}

tasks.named('remapJar') {
	inputFile.set shadowJar.archiveFile
	archiveClassifier = null
	archiveBaseName = "${rootProject.mod_id}-forge"
}
