plugins {
	id 'com.github.johnrengelman.shadow' version '8.1.1'
}

architectury {
	platformSetupLoomIde()
	neoForge()
}

loom {
	// No mixinConfig here, unlike the 1.20.1 Forge module: Loom's NeoForge support remaps the
	// mixin configs named in the mod's own META-INF/neoforge.mods.toml, so the common module's
	// config is picked up from there.
	runs {
		client {
			name = 'NeoForge Client (1.21.1)'
			// Throwaway verification instance, same budget as the 1.20.1 one.
			vmArgs '-Xmx2G', '-Xms512M'
			property 'mixin.debug', 'true'
			property 'mixin.checks', 'true'
		}
	}
}

configurations {
	common {
		canBeResolved = true
		canBeConsumed = false
	}
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentNeoForge.extendsFrom common

	shadowBundle {
		canBeResolved = true
		canBeConsumed = false
	}
}

dependencies {
	neoForge "net.neoforged:neoforge:${rootProject.neoforge_version_1_21_1}"

	modImplementation "dev.emi:emi-neoforge:${rootProject.emi_version_1_21_1}"
	// Optional: only drives the in-game config screen, never bundled.
	// Not transitive: see the note on the same dependency in mc1211/common/build.gradle.
	modCompileOnly("dev.isxander:yet-another-config-lib:${rootProject.yacl_version_1_21_1}-neoforge") {
		transitive = false
	}
	// ...but present in the dev client, otherwise the config screen can never be tested. YACL
	// jar-jars Kotlin for NeoForge, so dropping the transitive Kotlin here costs nothing.
	modLocalRuntime("dev.isxander:yet-another-config-lib:${rootProject.yacl_version_1_21_1}-neoforge") {
		transitive = false
	}

	// YACL jar-in-jars its json parsers, and NeoForge's JarJar unpacks them for a real install -
	// the published artifact's META-INF/jarjar/metadata.json lists them, so players are
	// unaffected. Loom's dev classpath does not run JarJar, so without these the dev client dies
	// at startup with NoClassDefFoundError: org/quiltmc/parsers/json/gson/GsonWriter and YACL
	// never loads. Runtime-only and dev-only: nothing here reaches a published jar.
	localRuntime "org.quiltmc.parsers:gson:${rootProject.quilt_parsers_version_1_21_1}"
	localRuntime "org.quiltmc.parsers:json:${rootProject.quilt_parsers_version_1_21_1}"

	common(project(path: ':mc1211-common', configuration: 'namedElements')) { transitive false }
	shadowBundle project(path: ':mc1211-common', configuration: 'transformProductionNeoForge')
}

tasks.named('shadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
	configurations = [project.configurations.shadowBundle]
	archiveClassifier = 'dev-shadow'
}

tasks.named('remapJar') {
	inputFile.set shadowJar.archiveFile
	archiveClassifier = null
	archiveBaseName = "emitreetabs-1.21.1-neoforge"
}
