loom.platform=neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
java_version=21
# mods.toml's loaderVersion, and on NeoForge that is the javafml/FML version - its major only -
# not the NeoForge version, which goes in this module's own dependency block below. NeoForge
# publishes FML as 4.0.x, so this is [4,). The 1.20.1 Forge module's [47,) is the Forge version
# instead, which is why the two cannot share one value.
loader_version_range=[4,)
# Read by the publish workflow. See the note on publish_loader in mc1211/fabric/gradle.properties.
publish_loader=neoforge
publish_game_version=1.21.1
