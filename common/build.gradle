architectury {
	common('neoforge', 'fabric')
	// No Architectury API at runtime, so its injected helper class is just dead weight.
	injectInjectables = false
}

loom {
	mixin {
		// Loom otherwise names this emitreetabs-common-common-refmap.json, which does not match
		// what the mixin config declares, leaving the refmap unfound at runtime.
		defaultRefmapName = "emitreetabs-common.refmap.json"
	}
}

// Plain JUnit tests for the parts that touch neither Minecraft nor EMI. TabLayout is the whole
// reason this source set exists: every tab bar bug so far has been arithmetic, and arithmetic can
// be tested in a second instead of by launching the game.
test {
	useJUnitPlatform()
	testLogging { events "failed"; exceptionFormat "full" }
}

dependencies {
	testImplementation platform("org.junit:junit-bom:5.10.2")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"

	// The common module compiles against Minecraft only. EMI publishes a loader-neutral jar, which
	// is exactly what a common module wants; the intermediary one, because modCompileOnly remaps
	// from intermediary like any other Fabric-side mod jar.
	modCompileOnly "dev.emi:emi-xplat-intermediary:${rootProject.emi_version}"

	// YACL: the dev.isxander.yacl3.* API is identical across loaders, so the Fabric artifact is a
	// compile-time reference and the settings screen lives in common rather than being written
	// twice. (Fabric, not NeoForge, because a common module is remapped with Fabric's tooling.)
	modCompileOnly "dev.isxander:yet-another-config-lib:${rootProject.yacl_version}-fabric"

	// Loom does not put Mixin on a common module's compile classpath, so it is declared here.
	// compileOnly because both loaders ship Mixin at runtime; the annotation processor writes the refmap.
	compileOnly "org.spongepowered:mixin:${rootProject.mixin_version}"
	annotationProcessor "org.spongepowered:mixin:${rootProject.mixin_version}:processor"
}
