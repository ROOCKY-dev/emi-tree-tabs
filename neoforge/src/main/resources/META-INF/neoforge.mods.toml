modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}
'''

# NeoForge spells dependencies "type", where Forge 1.20.1 said "mandatory=true". The two are not
# interchangeable: each loader rejects the other's spelling outright.
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neoforge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="emi"
    type="required"
    versionRange="${emi_version_range}"
    ordering="AFTER"
    side="CLIENT"

# Optional. Only used to draw the in-game settings screen; the json config works without it.
[[dependencies.${mod_id}]]
    modId="yet_another_config_lib_v3"
    type="optional"
    versionRange="[3.6,)"
    ordering="AFTER"
    side="CLIENT"

[[mixins]]
    config="${mod_id}-common.mixins.json"
