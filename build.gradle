plugins {
	id 'architectury-plugin' version "${architectury_plugin_version}"
	id 'dev.architectury.loom' version "${architectury_loom_version}" apply false
}

architectury {
	minecraft = minecraft_version
}

subprojects {
	apply plugin: 'dev.architectury.loom'

	loom {
		silentMojangMappingsLicense()
	}

	dependencies {
		minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
		// Official Mojang mappings, matching what the single-project ForgeGradle build used.
		mappings loom.officialMojangMappings()
	}
}

allprojects {
	apply plugin: 'java'
	apply plugin: 'architectury-plugin'
	apply plugin: 'maven-publish'

	base.archivesName = project == rootProject ? rootProject.mod_id : "${rootProject.mod_id}-${project.name}"
	version = rootProject.mod_version
	group = rootProject.mod_group_id

	repositories {
		maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/releases' }  // EMI
		maven { name = 'Shedaniel';      url = 'https://maven.shedaniel.me/' }                 // Cloth Config
		maven { name = 'Sponge';         url = 'https://repo.spongepowered.org/repository/maven-public/' }
		mavenCentral()
	}

	java {
		toolchain.languageVersion = JavaLanguageVersion.of(17)
		withSourcesJar()
	}

	tasks.withType(JavaCompile).configureEach {
		options.encoding = 'UTF-8'
		options.release = 17
	}

	tasks.withType(ProcessResources).configureEach {
		var replaceProperties = [
				minecraft_version      : rootProject.minecraft_version,
				minecraft_version_range: rootProject.minecraft_version_range,
				forge_version          : rootProject.forge_version,
				forge_version_range    : rootProject.forge_version_range,
				loader_version_range   : rootProject.loader_version_range,
				emi_version_range      : rootProject.emi_version_range,
				mod_id                 : rootProject.mod_id,
				mod_name               : rootProject.mod_name,
				mod_license            : rootProject.mod_license,
				mod_version            : rootProject.mod_version,
				mod_authors            : rootProject.mod_authors,
				mod_description        : rootProject.mod_description,
		]
		inputs.properties replaceProperties
		filesMatching(['META-INF/mods.toml', 'pack.mcmeta', 'fabric.mod.json']) {
			expand replaceProperties
		}
	}
}
